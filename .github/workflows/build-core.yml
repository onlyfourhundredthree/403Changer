name: Build 403Changer Loader core

# Builds native/pengu into core.dll on a Windows runner (MSVC + Node preinstalled)
# and uploads it as an artifact. It never touches "Pengu Loader/core.dll": download
# the artifact and swap it in once it has been tested against a live client.

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/pengu/**'
      - 'scripts/build_pengu_core.py'
      - '.github/workflows/build-core.yml'

env:
  # corepack otherwise stops to ask before downloading pnpm, which hangs CI
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  core:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build core.dll
        shell: pwsh
        run: |
          python scripts/build_pengu_core.py 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # The raw run log is served from a storage host some networks cannot reach,
      # so the tail of the build is repeated here as check annotations, which the
      # API returns as plain JSON.
      - name: Surface the build log
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) {
            Write-Host "::error::build.log was never written"
            exit 0
          }
          $lines = @(Get-Content build.log -Tail 160)
          for ($i = 0; $i -lt $lines.Count; $i += 20) {
            $last = [Math]::Min($i + 19, $lines.Count - 1)
            $msg = ($lines[$i..$last] -join "`n")
            $msg = $msg -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=build.log ($i)::$msg"
          }

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload core.dll
        uses: actions/upload-artifact@v4
        with:
          name: 403Changer-core-dll
          path: native/pengu/out/core.dll
          if-no-files-found: error
