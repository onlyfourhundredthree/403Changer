name: Build and Release 403Changer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release (otherwise the installer is only an artifact)'
        type: boolean
        default: false
      tag_suffix:
        description: 'Tag suffix, e.g. rc1 -> v2.0.3-rc1 (prerelease). Empty publishes a final release.'
        type: string
        default: 'rc1'

env:
  # corepack otherwise stops to ask before downloading pnpm, which hangs CI
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # A release usually comes from pushing a tag, but the tag can also be made
      # from here: this works out the tag the build should carry, and the release
      # step creates it at this commit. That keeps releasing to one click (or one
      # `gh workflow run`) for anyone who cannot push tags.
      - name: Work out the release tag
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
          else
            version=$(python -c "import re,pathlib;print(re.search(r'^APP_VERSION\s*=\s*\"([^\"]+)\"',pathlib.Path('config.py').read_text(encoding='utf-8'),re.M).group(1))")
            suffix="${TAG_SUFFIX:-}"
            tag="v${version}${suffix:+-${suffix}}"
          fi
          # A suffixed tag (v2.0.3-rc1) publishes as a prerelease. The app's updater
          # asks GitHub for /releases/latest, which skips prereleases, so a test build
          # can be installed by hand without being pushed to everyone.
          if [[ "$tag" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (prerelease: $prerelease)"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # PyInstaller packages the "Pengu Loader" folder as it stands, so the loader
      # core has to be built over the one in the tree before that step, or the
      # release would ship the stale core.dll committed to the repository.
      - name: Build the loader core (core.dll)
        run: |
          python scripts/build_pengu_core.py --install

      - name: Verify core.dll
        run: |
          python scripts/verify_core_dll.py "Pengu Loader/core.dll"

      - name: Build with PyInstaller
        run: |
          python scripts/build_pyinstaller.py

      - name: Create Windows Installer
        run: |
          python scripts/create_installer.py

      - name: Create Update Package
        run: |
          python scripts/create_update_package.py

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 403Changer-Installer
          path: installer/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            installer/*.exe
            installer/*.zip
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
