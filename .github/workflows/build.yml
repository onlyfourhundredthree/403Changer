name: Build and Release 403Changer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # corepack otherwise stops to ask before downloading pnpm, which hangs CI
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # PyInstaller packages the "Pengu Loader" folder as it stands, so the loader
      # core has to be built over the one in the tree before that step, or the
      # release would ship the stale core.dll committed to the repository.
      - name: Build the loader core (core.dll)
        run: |
          python scripts/build_pengu_core.py --install

      - name: Verify core.dll
        run: |
          python scripts/verify_core_dll.py "Pengu Loader/core.dll"

      - name: Build with PyInstaller
        run: |
          python scripts/build_pyinstaller.py

      - name: Create Windows Installer
        run: |
          python scripts/create_installer.py

      - name: Create Update Package
        run: |
          python scripts/create_update_package.py

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 403Changer-Installer
          path: installer/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            installer/*.zip
          draft: false
          # A tag with a suffix (v2.0.3-rc1) publishes as a prerelease. The app's
          # updater asks GitHub for /releases/latest, which skips prereleases, so a
          # test build can be downloaded by hand without being pushed to everyone.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
